# =============================================================================
# evtol_frozen_baseline — self-contained config
# =============================================================================
# Stage 0: preliminary frozen-DINOv2 analysis.
# Fill in every value marked EDIT-ME before running. Paths under `paths:` are
# resolved relative to the folder root (the directory containing this file)
# unless given as absolute paths.
# =============================================================================

paths:
  image_dir: "/mnt/storage_11tb/Drive_files_to_syncronize/3 - Images DataSets & Labelling Outputs/1627_DS/Shrouded vs Openrotor/Images Processed"        # LEGACY 1627_DS set (data.list_figures filename parsing)
  # Stage-02 manifests from Patent-Labelling-Tools (processor.process_batch) —
  # one CSV per batch mapping wizard Image_Path -> processed 518x518 PNG plus
  # per-image reviewer labels. Drives data.list_figures_manifest (notebook 10)
  # and labels.apply_processing_manifest (notebook 11).
  processing_manifest_glob: "/mnt/storage_11tb/Drive_files_to_syncronize/3 - Images DataSets & Labelling Outputs/1639_DS/data/processed/*/processing_manifest_*.csv"
  # Patent-Labelling-Tools' 02a_preprocessing output (Review sheet) — source of
  # T1 duplicateId/isDuplicate links. Drives data.list_figures_manifest's
  # dedupe_architectures=True (notebook 10): when a patent is a labelled
  # duplicate of another, only the chain ROOT's main image is kept, so the
  # same physical architecture filed under N patents doesn't count as N
  # separate points in the embedding QC / probes.
  reviewed_xlsx_glob: "/mnt/storage_11tb/Drive_files_to_syncronize/3 - Images DataSets & Labelling Outputs/1639_DS/data/reviewed xlsxs/Review_postprocess_*.xlsx"
  labels_excel: "/mnt/storage_11tb/Drive_files_to_syncronize/2 - Patente & Validation/3 -Raw_Patent_Exports_PatSeer_&Gold_Standard/1639__dataset_08_06_26.xlsx"     # the labelled PatSeer Excel
  # NOTE: notebook 10 reloads cached embeddings blindly from output_dir/embeddings,
  # so this points at a NEW folder for the 1639_DS 518px set (the old 1627_DS
  # 224px run stays untouched in .../outputs/analysis).
  output_dir: "/mnt/storage_11tb/Drive_files_to_syncronize/4 - Intelligence Models & Post Process Outputs/Preliminary_analysis/outputs/analysis_1639_518"

data:
  patent_id_col: "Record Number"          # column in the Excel holding the patent id
  # NOTE: shrouded_open (SHR/OPN) comes from the FILENAME (parse_patent_id), not
  # the Excel — list_figures already provides it as a per-figure column.
  label_cols: []                          # Excel-sourced labels only; add real columns here when needed
  # When the configuration-type column exists in the Excel (e.g. tilt-rotor /
  # tilt-wing / lift+cruise / multirotor / ducted), add it here, e.g.:
  #   label_cols: ["Configuration"]
  # Then notebooks/12_configuration_types.ipynb reads it via
  # analysis.multiclass_labels(metadata, labels, col="Configuration").
  config_type_col: "Configuration"        # EDIT-ME once the column exists in the Excel
  confound_cols:                          # joined by patent_id; derived axes (filing_year, is_bell) built in analysis
    - "Assignee"
    - "Assignee Country"
    - "Filing/Application Date"
    - "Publication Country"

analysis:
  model: "facebook/dinov2-large"
  layers: [18, 22, 24]
  pooling: [cls, mean_patch]
  # 518 = DINOv2/14's native hi-res input (37x37 patches). Overrides the HF
  # processor default (256-resize + 224-crop) which would otherwise silently
  # downscale the Stage-02 518px squares. Set to 0 for the legacy 224 behaviour.
  input_size: 518
  # 518px -> 1370 tokens/image vs 257 at 224px: ~5x activation memory with
  # output_hidden_states=True. 32 fit at 224; start at 16 for 518 and drop
  # to 8 if you OOM.
  batch_size: 16
  device: "cuda:1"        # used when `devices` below is unset/empty (single-GPU fallback)
  # Set to run embeddings.compute_embeddings_multi_gpu instead: splits figures
  # into len(devices) shards, one full model instance per device, run in
  # parallel threads (CUDA ops on different devices don't contend), merged
  # back in original row order. Leave empty/comment out for single-GPU.
  devices: ["cuda:0", "cuda:1"]
  aggregation:
    method: "mean"          # swappable later: mean | canonical | per_figure_type
  seed: 42

# ── Label export/analysis (notebooks 10a_label_export, 10b_label_analysis) ───
# NOTE: this repo only pivots + audits labels. The reference_matrix, UMAP,
# clustering, and confound-analysis keys that used to live in this block moved
# to eVTOL-Embedding-Evaluation/config.yaml (repo 3) alongside the joint code
# that consumes them (src/probes.py, src/structure_clustering.py).
taxonomy:
  # Pools every 02a-postprocessed export (same files/glob as paths.reviewed_xlsx_glob
  # above) — NOT the raw wizard export: 02a's output already has Rule A-G
  # corrections, duplicate inheritance and disapproved/exact-duplicate row
  # scoping applied. Add new batches by re-running 02a; no config change
  # needed here (glob picks them up automatically).
  wizard_excel_glob: "/mnt/storage_11tb/Drive_files_to_syncronize/3 - Images DataSets & Labelling Outputs/1639_DS/data/reviewed xlsxs/Review_postprocess_*.xlsx"
  metadata_excel: "/mnt/storage_11tb/Drive_files_to_syncronize/2 - Patente & Validation/3 -Raw_Patent_Exports_PatSeer_&Gold_Standard/1639__dataset_08_06_26.xlsx"
  output_dir: "/mnt/storage_11tb/Drive_files_to_syncronize/4 - Intelligence Models & Post Process Outputs/Preliminary_analysis/outputs/analysis_taxonomy"
  main_arch_only: false       # embed every labelled architecture per patent, not just arch 1
  min_class_count: 15         # classes below this are flagged in the coverage table
  year_bins: 3
  exclude_uncertain: false    # true -> drop architectures flagged humanUncertain

# ── SAM zero-shot diagnostic (notebooks/diagnostics/sam_mask_test.ipynb) ─────
# NOT a pipeline stage: no training/fine-tuning, no embeddings output. Cheap
# check of whether SAM's automatic mask generator produces clean, usable
# part-level masks (rotors/wings/booms/fuselage) on our patent figures before
# investing in a SAM-crops+SigLIP pipeline (12x). Read-only against
# sample_dir; never touches the labelling pipeline or other notebooks' state.
sam_test:
  model_type: "vit_h"        # vit_b (375MB, fastest) | vit_l | vit_h (2.4GB, best masks)
  checkpoint_path: "/mnt/storage_11tb/Drive_files_to_syncronize/4 - Intelligence Models & Post Process Outputs/model_checkpoints/sam_vit_h_4b8939.pth"  # EDIT-ME: download from Meta's SAM repo, not fetched by this repo
  sample_dir: "/mnt/storage_11tb/Drive_files_to_syncronize/3 - Images DataSets & Labelling Outputs/1639_DS/processed/Batch_05/main"
  output_dir: "outputs/sam_test"   # local, git-ignored (see outputs/** in .gitignore)
  n_samples: 18               # random subset drawn from sample_dir
  device: "cuda:0"             # explicit — both cuda:0/cuda:1 free right now
  seed: 42
